<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Challenges</title>
<meta name="theme-color" content="#0e0d0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='6' width='26' height='20' rx='3' fill='%23f0b54a'/><g fill='%230e0d0c'><rect x='6' y='9' width='3' height='3'/><rect x='6' y='20' width='3' height='3'/><rect x='23' y='9' width='3' height='3'/><rect x='23' y='20' width='3' height='3'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A dark screening room: header and add bar on top, then a horizontal row of director cards,
   each a film-still banner over a poster wall. Unwatched posters sit in grey; watching one lights it up. */
:root {
  color-scheme: dark;
  --bg: #0e0d0c; --bg-glow: #1d1a16; --surface: #171513; --raise: #221f1b;
  --fg: #f3ede4; --muted: #a0978a; --line: #2f2a24;
  --accent: #f0b54a; --accent-ink: #1a1307; --danger: #ff8a7a;
  --marquee: "Big Shoulders Display", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --card-w: min(84vw, 340px);
  --side: max(20px, env(safe-area-inset-left, 0px), calc((100vw - 1200px) / 2 + 16px));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: radial-gradient(120% 60% at 50% -10%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: var(--side); padding-right: var(--side); }

header { padding-block: 28px 8px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.brand { min-width: 0; }
.brand h1 { font-family: var(--marquee); font-weight: 900; font-size: clamp(2.1rem, 9vw, 4rem); line-height: .9; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 8px 0 0; color: var(--muted); }

/* Trophy room */
.trophy-view { padding-block: 18px 32px; }
.tv-title { margin: 0 0 18px; font-family: var(--marquee); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; line-height: 1; }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.tcard { position: relative; background: var(--surface); border: 1px solid rgba(240,181,74,.55); border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(0,0,0,.8), 0 0 50px -30px rgba(240,181,74,.7); }
.tbanner { height: 170px; background: var(--raise); position: relative; }
.tbanner img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.35) saturate(1.1); }
.tbanner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--surface)); }
.medal { position: absolute; top: 112px; left: 18px; display: flex; }
.medal > img, .medal > .ini { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; object-position: center 20%; background: var(--raise); display: grid; place-items: center; font-family: var(--marquee); font-weight: 900; font-size: 2rem; color: var(--muted); box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--surface), 0 0 34px -4px rgba(240,181,74,.8); }
.medal.duo > :nth-child(2) { margin-left: -22px; }
.medal-badge { position: absolute; right: -6px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); background: radial-gradient(circle at 35% 30%, #ffe3a3, var(--accent) 55%, #b9822a); box-shadow: 0 0 0 3px var(--surface); }
.medal-badge svg { width: 19px; height: 19px; }
.tbody { padding: 50px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.tbody h3 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 2rem; line-height: .95; text-transform: uppercase; }
.tmeta { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tavg { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.tavg .stars { font-size: 1rem; }
.tfav { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .9rem; }
.tfav span { display: block; font-family: var(--mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.tfav small { font-family: var(--mono); color: var(--muted); }
.toast { cursor: pointer; }

/* Setup and sign-in panels */
.field.code { font-family: var(--mono); font-size: 1.4rem; letter-spacing: .3em; text-align: center; }
.panel { margin: 24px var(--side); max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; line-height: 1; }
.panel p { margin: 0; color: var(--muted); }
.panel a { color: var(--accent); }
.panel ol { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.field { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
.field::placeholder { color: var(--muted); }

/* Add bar */
.addbar { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.add-row .field { flex: 1 1 220px; width: auto; }
.btn { border: 1px solid var(--line); background: var(--raise); padding: 11px 16px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.results { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.result { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; flex: none; text-align: left; }
.result:hover { border-color: var(--accent); }
.result .meta { display: block; font-family: var(--mono); font-size: .68rem; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--raise); flex: none; display: grid; place-items: center; font-family: var(--marquee); font-weight: 800; color: var(--muted); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.err { color: var(--danger); }
.suggest { display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accent); max-width: 560px; }
.suggest .pic { width: 132px; aspect-ratio: 16 / 10; border-radius: 10px; flex: none; background: var(--raise); overflow: hidden; }
.suggest .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.suggest .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.suggest strong { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.suggest .add-row .btn { padding: 8px 12px; }
@media (max-width: 420px) { .suggest .pic { width: 88px; } }

/* Card row */
.rowwrap { position: relative; margin-top: 22px; }
.row { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block: 6px 28px; padding-left: var(--side); scroll-padding-left: var(--side); align-items: flex-start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
@media (hover: hover) and (pointer: fine) { .row { cursor: grab; scroll-snap-type: none; } }
.row.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.row.dragging .art { pointer-events: none; }
.row::after { content: ""; flex: 0 0 max(4px, calc(var(--side) - 16px)); }
.nav { position: absolute; top: 120px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: rgba(23,21,19,.88); backdrop-filter: blur(6px); font-size: 1.2rem; z-index: 2; display: none; }
.nav:hover { border-color: var(--accent); color: var(--accent); }
.nav.prev { left: max(8px, env(safe-area-inset-left, 0px)); } .nav.next { right: max(8px, env(safe-area-inset-right, 0px)); }
@media (hover: hover) and (min-width: 720px) { .nav { display: grid; place-items: center; } }

.card { flex: 0 0 var(--card-w); scroll-snap-align: start; scroll-snap-stop: always; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(0,0,0,.8); }
.banner { position: relative; height: 210px; background: var(--raise); overflow: hidden; }
.banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner .initials { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--marquee); font-weight: 900; font-size: 5rem; color: var(--line); }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(14,13,12,.55) 62%, var(--surface) 100%); }
.banner .cap { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.banner h2 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 2.1rem; line-height: .92; text-transform: uppercase; text-wrap: balance; min-width: 0; }
.count { font-family: var(--mono); font-size: .82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.count b { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; color: var(--accent); }
.badge { position: absolute; top: 12px; right: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; font-weight: 700; letter-spacing: .04em; box-shadow: 0 0 22px -2px rgba(240,181,74,.7); }
.badge svg { width: 18px; height: 18px; }
.card.done { border-color: rgba(240,181,74,.55); }
.stars { font-size: .7rem; letter-spacing: 1px; color: var(--accent); }
.stars i { font-style: normal; color: rgba(243,237,228,.25); }
.stars.on-poster { position: absolute; right: 5px; bottom: 5px; background: rgba(14,13,12,.75); padding: 1px 5px; border-radius: 99px; font-size: .58rem; letter-spacing: 0; }
.rate { display: flex; gap: 2px; }
.rate button { border: none; background: none; padding: 2px; font-size: 1.7rem; line-height: 1; color: var(--line); transition: color .12s, transform .12s; }
.rate button.on { color: var(--accent); }
@media (hover: hover) {
  .rate button:hover { transform: scale(1.12); }
  .rate:hover button { color: var(--accent); }
  .rate button:hover ~ button { color: var(--line); }
}
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accent); box-shadow: 0 18px 50px -10px rgba(0,0,0,.8), 0 0 40px -10px rgba(240,181,74,.6); width: max-content; max-width: calc(100% - 32px); font-size: .86rem; color: var(--muted); }
.toast[hidden] { display: none; }
.toast b { display: block; font-family: var(--marquee); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; color: var(--fg); line-height: 1; margin-bottom: 2px; }
.toast-icon { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.toast-icon svg { width: 26px; height: 26px; }
.toast.show { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
.toast.show .toast-icon { animation: spin .8s .1s ease-out; }
@keyframes pop { from { transform: translateX(-50%) translateY(30px) scale(.9); opacity: 0; } }
@keyframes spin { from { transform: rotate(-30deg) scale(.6); } }

.strip { margin: 4px 16px 0; background: #050504; border-radius: 4px; padding: 5px 4px; position: relative; }
.strip::before, .strip::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; background-image: radial-gradient(circle, #3a342c 0.9px, transparent 1.2px); background-size: 6px 2px; }
.strip::before { top: 1.5px; } .strip::after { bottom: 1.5px; }
.frames { display: flex; gap: 2px; height: 12px; }
.frame { flex: 1; border-radius: 1.5px; background: #2a2620; transition: background .25s; }
.frame.on { background: var(--accent); box-shadow: 0 0 6px -1px var(--accent); }

.posters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; padding: 14px 14px 6px; }
.poster { position: relative; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.poster .art { all: unset; cursor: pointer; position: relative; display: block; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.poster .art:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.poster .art:hover { transform: translateY(-2px); }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) brightness(.55); transition: filter .3s; }
.poster.watched img { filter: none; }
.poster.watched .art { box-shadow: 0 0 0 2px var(--accent); }
.poster.removed { opacity: .45; }
.poster.removed img { filter: grayscale(1); }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; font-family: var(--marquee); font-weight: 800; text-transform: uppercase; line-height: .95; font-size: .95rem; color: var(--fg); overflow: hidden; overflow-wrap: anywhere; }
.ph small { font-family: var(--mono); font-weight: 400; font-size: .62rem; color: var(--muted); }
.poster:not(.watched) .ph { opacity: .55; }
.tick { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(243,237,228,.7); background: rgba(14,13,12,.55); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: transparent; z-index: 1; }
.tick:hover { border-color: var(--accent); }
.poster.watched .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.flag { position: absolute; left: 5px; bottom: 5px; font-size: .6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(14,13,12,.75); color: var(--fg); padding: 1px 6px; border-radius: 99px; }
.hover-title { position: absolute; inset: auto 0 0 0; z-index: 2; padding: 22px 7px 7px; font-size: .72rem; font-weight: 600; line-height: 1.2; color: var(--fg); background: linear-gradient(to top, rgba(14,13,12,.95) 40%, transparent); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none; }
.poster .art:focus-visible .hover-title { opacity: 1; transform: none; }
@media (hover: hover) { .poster .art:hover .hover-title { opacity: 1; transform: none; } }
@media (hover: none) { .hover-title { display: none; } }
html.modal-open, html.modal-open body { overflow: hidden; overscroll-behavior: none; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 16px 14px; }
.foot-left { display: flex; align-items: center; gap: 12px; }
.move { display: flex; gap: 4px; }
.move-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); color: var(--muted); font-size: 1.05rem; line-height: 1; display: grid; place-items: center; padding: 0; }
.move-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.move-btn:disabled { opacity: .3; cursor: default; }
.linkbtn { border: none; background: none; color: var(--muted); font-size: .8rem; padding: 4px 0; }
.linkbtn:hover, .linkbtn.armed { color: var(--danger); }
.linkbtn.armed { font-weight: 600; }
.linkbtn[data-showremoved]:hover { color: var(--fg); }
.skeleton { padding: 30px 16px; color: var(--muted); text-align: center; font-size: .9rem; }

.empty { flex: 0 0 min(100%, 520px); padding: 40px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 20px; text-align: center; }
.empty strong { display: block; font-family: var(--marquee); font-weight: 800; font-size: 1.8rem; text-transform: uppercase; color: var(--fg); margin-bottom: 6px; }

/* Film sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
/* Fixed size, so the arrows stay put while stepping between films; the plot scrolls instead. */
.sheet { position: relative; width: min(100%, 880px); height: min(620px, calc(100vh - 32px)); overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px 28px; padding: 22px 26px 26px; }
.sheet-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.sheet-nav { display: flex; gap: 8px; }
.nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); font-size: 1.3rem; line-height: 1; display: grid; place-items: center; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.sheet .big { all: unset; cursor: pointer; position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--raise); align-self: start; box-shadow: 0 20px 40px -20px rgba(0,0,0,.9); }
.sheet .big:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.big-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(14,13,12,.8); opacity: 0; transition: opacity .15s; }
.sheet .big:hover .big-hint, .sheet .big:focus-visible .big-hint { opacity: 1; }
@media (hover: none) { .big-hint { opacity: .85; } }
.sheet .head { display: flex; flex-direction: column; gap: 10px; }
.film-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; font-family: var(--mono); font-size: .8rem; color: var(--muted); min-height: 24px; }
.film-meta > span:not(:empty) + span:not(:empty)::before { content: "·"; margin: 0 10px; }
.take { padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.watch-toggle[aria-pressed="true"] { background: rgba(240,181,74,.14); border-color: rgba(240,181,74,.6); color: var(--accent); }
.poster-col { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.poster-col .links { display: flex; justify-content: center; gap: 10px; }
.foot-right { display: flex; gap: 8px; }
.sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.site-icon { display: inline-flex; border-radius: 5px; opacity: .85; transition: opacity .15s, transform .15s; }
.site-icon:hover, .site-icon:focus-visible { opacity: 1; transform: translateY(-1px); }
.site-icon svg { width: 44px; height: 22px; display: block; }
.picker { position: absolute; inset: 0; z-index: 3; background: var(--surface); display: flex; flex-direction: column; gap: 14px; padding: 22px 26px; }
.picker-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.picker-top strong { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; }
.picker-top span { display: flex; gap: 8px; }
.picker-top .btn { padding: 8px 12px; }
.picker-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; grid-auto-rows: max-content; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.pick { all: unset; cursor: pointer; display: block; position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--line); }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick:hover, .pick:focus-visible { box-shadow: 0 0 0 2px var(--fg); }
.pick.on { box-shadow: 0 0 0 3px var(--accent); }
.pick span { position: absolute; left: 4px; top: 4px; font-family: var(--mono); font-size: .6rem; text-transform: uppercase; padding: 1px 5px; border-radius: 99px; background: rgba(14,13,12,.8); }
.sheet .big img { width: 100%; height: 100%; object-fit: cover; }
.sheet .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.sheet .body > * { flex: none; }
.sheet .eyebrow { font-family: var(--mono); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet h3 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 3rem; line-height: .92; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .body > .overview { flex: 0 1 auto; min-height: 3em; overflow-y: auto; font-size: .92rem; line-height: 1.5; color: var(--muted); margin: 0; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.sheet .body > .spacer { flex: 1 1 0; }
.sheet textarea { font: inherit; font-size: .92rem; width: 100%; min-height: 100px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
.sheet textarea:focus { border-color: var(--accent); outline: none; }
@media (max-width: 640px) {
  .sheet-back { align-items: flex-end; padding: 0; }
  /* Phone: one scrolling column, poster beside the title, everything else full width. */
  .sheet { grid-template-columns: 110px minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: max-content; align-content: start; gap: 14px 16px; padding: 16px 16px max(20px, env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; height: 92vh; height: 92dvh; overflow-y: auto; overscroll-behavior: contain; }
  .sheet .body { display: contents; }
  .sheet .head { grid-column: 2; align-self: center; }
  .sheet .body > .overview, .sheet .take, .sheet-foot { grid-column: 1 / -1; }
  .sheet .body > .overview { overflow: visible; min-height: auto; padding-right: 0; }
  .sheet .body > .spacer { display: none; }
  .sheet-foot { flex-wrap: wrap; }
  .sheet-foot .foot-right { margin-left: auto; }
  .poster-col .links { gap: 6px; }
  .site-icon svg { width: 48px; height: 24px; }
  .picker { position: fixed; padding: 18px 16px; }
  .sheet h3 { font-size: 1.9rem; }
}
footer { padding-block: 8px 28px; color: var(--muted); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
footer img { height: 12px; }
/* View switcher */

/* Watch date in the film sheet */
.take-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.watched-on { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); }
.watched-on[hidden] { display: none; }
.watched-on input, .ud-row input { font: inherit; font-size: .84rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; color-scheme: dark; }
.watched-on input:focus, .ud-row input:focus { border-color: var(--accent); outline: none; }

/* Suggested directors */
.recs { display: flex; flex-direction: column; gap: 6px; }
.recs:empty { display: none; }
.recs-label { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.recs .meta { max-width: 260px; }

/* Tier list */
.tier-btn-row { display: flex; }
.tier-open { margin-top: 10px; align-self: flex-start; padding: 8px 14px; }
.tier-sheet { position: relative; width: min(100%, 880px); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 12px; }
.tier-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tier-top h3 { margin: 4px 0 0; font-family: var(--marquee); font-weight: 800; font-size: 2.2rem; line-height: .95; text-transform: uppercase; }
.tier-top .eyebrow { font-family: var(--mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tiers { display: flex; flex-direction: column; gap: 6px; }
.tier-row { display: flex; gap: 8px; min-height: 96px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); padding: 6px; cursor: pointer; }
.tier-row.unranked { background: none; border-style: dashed; }
.tier-label { flex: none; width: 46px; border-radius: 8px; display: grid; place-items: center; font-family: var(--marquee); font-weight: 900; font-size: 1.6rem; color: #14110c; background: var(--line); }
.t-S { background: #f0b54a; } .t-A { background: #ef8f5d; } .t-B { background: #d9c45c; } .t-C { background: #7fbf98; } .t-D { background: #7d9fd0; }
.tier-row.unranked .tier-label { background: var(--raise); color: var(--muted); }
.tier-zone { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.tchip { all: unset; cursor: grab; display: block; width: 56px; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--raise); position: relative; box-shadow: 0 0 0 1px var(--line); transition: transform .12s; }
.tchip img, .tchip .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
.tchip .ph { font-size: .5rem; padding: 4px; }
.tchip:hover { transform: translateY(-2px); }
.tchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tchip.sel { box-shadow: 0 0 0 3px var(--accent); transform: translateY(-3px) scale(1.06); }
.mini-tiers { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mini-row { display: flex; gap: 6px; align-items: center; }
.mini-row .tier-label { width: 22px; height: 30px; font-size: .85rem; border-radius: 4px; }
.mini-row > div { display: flex; flex-wrap: wrap; gap: 3px; }
.mini { display: block; width: 20px; height: 30px; border-radius: 3px; overflow: hidden; background: var(--raise); }
.mini img, .mini .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .ph { font-size: 0; padding: 0; }
@media (max-width: 640px) {
  #tierBack { align-items: flex-end; padding: 0; }
  .tier-sheet { border-radius: 24px 24px 0 0; padding: 18px 16px max(20px, env(safe-area-inset-bottom, 0px)); max-height: 92vh; }
  .tier-top h3 { font-size: 1.7rem; }
  .tier-row { min-height: 80px; }
  .tier-label { width: 34px; font-size: 1.3rem; }
  .tchip { width: 46px; }
}

/* Watch calendar */
.cal-view { padding-block: 18px 32px; display: flex; flex-direction: column; gap: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cal-head .tv-title { margin: 0; }
.cal-years { display: flex; gap: 4px; }
.cal-years button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 5px 12px; font-family: var(--mono); font-size: .8rem; }
.cal-years button.on { color: var(--fg); border-color: var(--accent); }
.cal-stats { display: flex; flex-wrap: wrap; gap: 14px 30px; font-family: var(--mono); font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.cal-stats b { display: block; font-family: var(--marquee); font-size: 2rem; letter-spacing: 0; color: var(--fg); font-weight: 800; line-height: 1; }
.cal-scroll { overflow-x: auto; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.cal { --cell: 13px; --gap: 3px; width: max-content; }
.cal-months { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); column-gap: var(--gap); height: 16px; font-family: var(--mono); font-size: .64rem; color: var(--muted); }
.cal-months span { white-space: nowrap; }
.cal-grid { display: grid; grid-template-rows: repeat(7, var(--cell)); grid-auto-flow: column; grid-auto-columns: var(--cell); gap: var(--gap); }
.day { display: block; width: var(--cell); height: var(--cell); border-radius: 3px; background: var(--raise); border: none; padding: 0; }
.day.out { background: none; }
.day.l1 { background: rgba(240,181,74,.35); } .day.l2 { background: rgba(240,181,74,.65); } .day.l3 { background: var(--accent); box-shadow: 0 0 6px -1px var(--accent); }
button.day:hover { outline: 1px solid var(--fg); }
.day.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.day.now { box-shadow: inset 0 0 0 1px var(--muted); }
.cal-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: .72rem; color: var(--muted); --cell: 11px; }
.cal-legend .day { margin: 0 1px; }
.cal-day h3 { margin: 0 0 10px; font-family: var(--marquee); font-weight: 800; font-size: 1.4rem; text-transform: uppercase; }
.cal-films { display: flex; flex-wrap: wrap; gap: 10px; }
.cal-film { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.cal-film:hover { border-color: var(--accent); }
.cal-film b, .ud-title b { display: block; font-size: .92rem; }
.cal-film small, .ud-title small { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.cf-poster { flex: none; width: 40px; aspect-ratio: 2 / 3; border-radius: 5px; overflow: hidden; background: var(--raise); position: relative; display: block; }
.cf-poster img, .cf-poster .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
.cf-poster .ph { font-size: 0; padding: 0; }
.undated { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.undated .linkbtn { color: var(--accent); font-size: .88rem; }
.undated-list { display: flex; flex-direction: column; gap: 8px; width: min(100%, 560px); }
.ud-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ud-row .ud-title { flex: 1; min-width: 0; }
.ud-row input { width: auto; }
/* Header: home link and My stats */
.brand h1 a { color: inherit; text-decoration: none; }
.stats-btn { flex: none; margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 600; white-space: nowrap; }
.stats-btn:hover, .stats-btn.on { border-color: var(--accent); }
.stats-btn svg { width: 18px; height: 18px; color: var(--accent); }
.stats-btn b { font-family: var(--marquee); font-weight: 800; font-size: 1.15rem; line-height: 1; color: var(--accent); }
.crumb { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding-block: 14px 0; }
.crumb h2 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; line-height: 1; }
.crumb .back { font-size: .86rem; }
.crumb .back:hover, .linkbtn.accent:hover { color: var(--fg); }
.linkbtn.accent { color: var(--accent); }

/* Home: one big card per challenge */
.home { padding-block: 22px 40px; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; }
.hcard { all: unset; box-sizing: border-box; cursor: pointer; position: relative; display: flex; align-items: flex-end; min-height: 380px; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, var(--raise), var(--surface)); border: 1px solid var(--line); box-shadow: 0 24px 50px -28px rgba(0,0,0,.9); transition: transform .2s, border-color .2s; }
.hcard:hover { transform: translateY(-3px); border-color: var(--accent); }
.hcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hbg { position: absolute; inset: 0; }
.hbg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s; }
.hcard:hover .hbg img { transform: scale(1.04); }
.hbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(14,13,12,.05) 15%, rgba(14,13,12,.7) 58%, var(--surface)); }
.hbody { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 6px; padding: 24px; }
.hbody .eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hbody strong { font-family: var(--marquee); font-weight: 900; font-size: clamp(2.5rem, 8vw, 3.6rem); line-height: .9; text-transform: uppercase; }
.hdesc { color: var(--fg); opacity: .88; }
.hstats { font-family: var(--mono); font-size: .76rem; color: var(--muted); letter-spacing: .03em; }
@media (max-width: 640px) { .hcard { min-height: 270px; } .hbody { padding: 20px; } }

/* Decade challenges */
.decades { padding-block: 16px 0; }
.dec-new { max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
.dec-new label { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.dec-new select { width: auto; padding-block: 10px; }
.setup { margin-inline: 0; }
.poster .art.slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; background: repeating-linear-gradient(135deg, var(--raise) 0 8px, #1c1916 8px 16px); box-shadow: inset 0 0 0 1.5px var(--line); }
.poster .art.slot:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.slot-dec { font-family: var(--marquee); font-weight: 800; font-size: 1.1rem; text-transform: uppercase; line-height: 1; }
.slot-plus { font-size: 1.6rem; line-height: 1; color: var(--accent); }
.slot-hint { font-size: .66rem; color: var(--muted); }
.sheet.slot-sheet { display: flex; flex-direction: column; gap: 12px; }
.slot-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.slot-top h3 { margin: 4px 0 0; font-family: var(--marquee); font-weight: 800; font-size: 2rem; line-height: .95; text-transform: uppercase; }
.pick:disabled { opacity: .35; cursor: default; }
.pick-cap { position: absolute; inset: auto 0 0 0; padding: 20px 6px 6px; font-size: .68rem; font-weight: 600; font-style: normal; line-height: 1.15; background: linear-gradient(to top, rgba(14,13,12,.95) 45%, transparent); }
.pick-cap small { font-family: var(--mono); font-weight: 400; color: var(--muted); }
.pick .ph { font-size: .8rem; }
@media (max-width: 640px) { .slot-top h3 { font-size: 1.6rem; } }

/* My stats */
.stats { padding-block: 16px 36px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 22px; }
.seg button { border: none; background: none; color: var(--muted); padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: .88rem; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--raise); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.stats .trophy-view, .stats .cal-view { padding-block: 0; }
.tsec + .tsec { margin-top: 34px; }
.tv-title small { font-family: var(--mono); font-weight: 500; font-size: .85rem; color: var(--muted); margin-left: 10px; }
.tsec .empty { max-width: 520px; }
.medal > .ini.dec { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.25rem; line-height: .95; color: var(--accent); }
.medal > .ini.dec i { font-family: var(--mono); font-style: normal; font-size: .55rem; color: var(--muted); text-transform: uppercase; margin: 2px 0; }
.dec-films { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dec-films .mini { width: 30px; height: 45px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--marquee); font-weight: 800; font-size: 2.4rem; line-height: 1; }
.tile span { font-size: .86rem; overflow-wrap: anywhere; }
.tile small { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.chart h3 { margin: 0 0 12px; font-size: .95rem; }
.bar-row { display: grid; grid-template-columns: 78px 1fr 30px; align-items: center; gap: 10px; padding: 4px 0; font-size: .84rem; }
.bar-label { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.bar-track { height: 14px; display: flex; }
.bar { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 3px; transition: filter .15s; }
.bar-row:hover .bar { filter: brightness(1.2); }
.bar-row:hover .bar-label { color: var(--fg); }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<header class="gutter">
  <div class="brand">

  <button class="stats-btn" type="button" id="statsBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg><span>My stats</span><b id="trophyCount">0</b></button>
</header>

<main id="screen"></main>
<section class="gutter home" id="homeView" hidden></section>
<div class="gutter crumb" id="crumb" hidden></div>

<section class="addbar gutter" id="addPanel" hidden>

  <div class="results" id="results"></div>
  <div class="recs" id="recs"></div>
</section>

  <div class="row" id="cards"></div>
  <button class="nav next" type="button" id="nextBtn" hidden aria-label="Scroll right">›</button>
</div>

<section class="gutter decades" id="decView" hidden><div id="decNew"></div></section>

    <button type="button" role="tab" data-stab="trophies">Trophies</button>
    <button type="button" role="tab" data-stab="numbers">Stats</button>
    <button type="button" role="tab" data-stab="calendar">Calendar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="app.js?v=29"></script>
