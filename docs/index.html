<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Director Runs</title>
<meta name="theme-color" content="#0e0d0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='6' width='26' height='20' rx='3' fill='%23f0b54a'/><g fill='%230e0d0c'><rect x='6' y='9' width='3' height='3'/><rect x='6' y='20' width='3' height='3'/><rect x='23' y='9' width='3' height='3'/><rect x='23' y='20' width='3' height='3'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A dark screening room: header and add bar on top, then a horizontal row of director cards,
   each a film-still banner over a poster wall. Unwatched posters sit in grey; watching one lights it up. */
:root {
  color-scheme: dark;
  --bg: #0e0d0c; --bg-glow: #1d1a16; --surface: #171513; --raise: #221f1b;
  --fg: #f3ede4; --muted: #a0978a; --line: #2f2a24;
  --accent: #f0b54a; --accent-ink: #1a1307; --danger: #ff8a7a;
  --marquee: "Big Shoulders Display", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --card-w: min(84vw, 340px);
  --side: max(20px, env(safe-area-inset-left, 0px), calc((100vw - 1200px) / 2 + 16px));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: radial-gradient(120% 60% at 50% -10%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: var(--side); padding-right: var(--side); }

header { padding-block: 28px 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.brand { min-width: 0; }
.brand h1 { font-family: var(--marquee); font-weight: 900; font-size: clamp(2.6rem, 8vw, 4rem); line-height: .9; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 8px 0 0; color: var(--muted); }
.trophy-btn { flex: none; margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 11px; border-radius: 99px; border: 1px solid rgba(240,181,74,.45); background: linear-gradient(180deg, rgba(240,181,74,.16), rgba(240,181,74,.04)); font-size: .88rem; font-weight: 600; white-space: nowrap; }
.trophy-btn:hover { border-color: var(--accent); }
.trophy-btn svg { width: 20px; height: 20px; color: var(--accent); filter: drop-shadow(0 0 6px rgba(240,181,74,.5)); }
.trophy-btn b { font-family: var(--marquee); font-weight: 800; font-size: 1.2rem; line-height: 1; color: var(--accent); }
@media (max-width: 480px) { .trophy-btn .tb-label { display: none; } }

/* Trophy room */
.trophy-view { padding-block: 18px 32px; }
.tv-title { margin: 0 0 18px; font-family: var(--marquee); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; line-height: 1; }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.tcard { position: relative; background: var(--surface); border: 1px solid rgba(240,181,74,.55); border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(0,0,0,.8), 0 0 50px -30px rgba(240,181,74,.7); }
.tbanner { height: 170px; background: var(--raise); position: relative; }
.tbanner img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.35) saturate(1.1); }
.tbanner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--surface)); }
.medal { position: absolute; top: 112px; left: 18px; display: flex; }
.medal > img, .medal > .ini { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; object-position: center 20%; background: var(--raise); display: grid; place-items: center; font-family: var(--marquee); font-weight: 900; font-size: 2rem; color: var(--muted); box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--surface), 0 0 34px -4px rgba(240,181,74,.8); }
.medal.duo > :nth-child(2) { margin-left: -22px; }
.medal-badge { position: absolute; right: -6px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); background: radial-gradient(circle at 35% 30%, #ffe3a3, var(--accent) 55%, #b9822a); box-shadow: 0 0 0 3px var(--surface); }
.medal-badge svg { width: 19px; height: 19px; }
.tbody { padding: 50px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.tbody h3 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 2rem; line-height: .95; text-transform: uppercase; }
.tmeta { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tavg { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.tavg .stars { font-size: 1rem; }
.tfav { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .9rem; }
.tfav span { display: block; font-family: var(--mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.tfav small { font-family: var(--mono); color: var(--muted); }
.toast { cursor: pointer; }

/* Setup and sign-in panels */
.panel { margin: 24px var(--side); max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; line-height: 1; }
.panel p { margin: 0; color: var(--muted); }
.panel a { color: var(--accent); }
.panel ol { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.field { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
.field::placeholder { color: var(--muted); }

/* Add bar */
.addbar { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.add-row .field { flex: 1 1 220px; width: auto; }
.btn { border: 1px solid var(--line); background: var(--raise); padding: 11px 16px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.results { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.result { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; flex: none; text-align: left; }
.result:hover { border-color: var(--accent); }
.result .meta { display: block; font-family: var(--mono); font-size: .68rem; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--raise); flex: none; display: grid; place-items: center; font-family: var(--marquee); font-weight: 800; color: var(--muted); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.err { color: var(--danger); }
.suggest { display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accent); max-width: 560px; }
.suggest .pic { width: 132px; aspect-ratio: 16 / 10; border-radius: 10px; flex: none; background: var(--raise); overflow: hidden; }
.suggest .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.suggest .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.suggest strong { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.suggest .add-row .btn { padding: 8px 12px; }
@media (max-width: 420px) { .suggest .pic { width: 88px; } }

/* Card row */
.rowwrap { position: relative; margin-top: 22px; }
.row { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; padding-block: 6px 28px; padding-left: var(--side); scroll-padding-left: var(--side); align-items: flex-start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.row::after { content: ""; flex: 0 0 max(4px, calc(var(--side) - 16px)); }
.nav { position: absolute; top: 120px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: rgba(23,21,19,.88); backdrop-filter: blur(6px); font-size: 1.2rem; z-index: 2; display: none; }
.nav:hover { border-color: var(--accent); color: var(--accent); }
.nav.prev { left: max(8px, env(safe-area-inset-left, 0px)); } .nav.next { right: max(8px, env(safe-area-inset-right, 0px)); }
@media (hover: hover) and (min-width: 720px) { .nav { display: grid; place-items: center; } }

.card { flex: 0 0 var(--card-w); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(0,0,0,.8); }
.banner { position: relative; height: 210px; background: var(--raise); overflow: hidden; }
.banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner .initials { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--marquee); font-weight: 900; font-size: 5rem; color: var(--line); }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(14,13,12,.55) 62%, var(--surface) 100%); }
.banner .cap { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.banner h2 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 2.1rem; line-height: .92; text-transform: uppercase; text-wrap: balance; min-width: 0; }
.count { font-family: var(--mono); font-size: .82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.count b { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; color: var(--accent); }
.badge { position: absolute; top: 12px; right: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; font-weight: 700; letter-spacing: .04em; box-shadow: 0 0 22px -2px rgba(240,181,74,.7); }
.badge svg { width: 18px; height: 18px; }
.card.done { border-color: rgba(240,181,74,.55); }
.stars { font-size: .7rem; letter-spacing: 1px; color: var(--accent); }
.stars i { font-style: normal; color: rgba(243,237,228,.25); }
.stars.on-poster { position: absolute; right: 5px; bottom: 5px; background: rgba(14,13,12,.75); padding: 1px 5px; border-radius: 99px; font-size: .58rem; letter-spacing: 0; }
.rate { display: flex; gap: 2px; }
.rate button { border: none; background: none; padding: 2px; font-size: 1.7rem; line-height: 1; color: var(--line); transition: color .12s, transform .12s; }
.rate button.on { color: var(--accent); }
@media (hover: hover) {
  .rate button:hover { transform: scale(1.12); }
  .rate:hover button { color: var(--accent); }
  .rate button:hover ~ button { color: var(--line); }
}
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accent); box-shadow: 0 18px 50px -10px rgba(0,0,0,.8), 0 0 40px -10px rgba(240,181,74,.6); width: max-content; max-width: calc(100% - 32px); font-size: .86rem; color: var(--muted); }
.toast[hidden] { display: none; }
.toast b { display: block; font-family: var(--marquee); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; color: var(--fg); line-height: 1; margin-bottom: 2px; }
.toast-icon { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.toast-icon svg { width: 26px; height: 26px; }
.toast.show { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
.toast.show .toast-icon { animation: spin .8s .1s ease-out; }
@keyframes pop { from { transform: translateX(-50%) translateY(30px) scale(.9); opacity: 0; } }
@keyframes spin { from { transform: rotate(-30deg) scale(.6); } }

.strip { margin: 4px 16px 0; background: #050504; border-radius: 4px; padding: 5px 4px; position: relative; }
.strip::before, .strip::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; background-image: radial-gradient(circle, #3a342c 0.9px, transparent 1.2px); background-size: 6px 2px; }
.strip::before { top: 1.5px; } .strip::after { bottom: 1.5px; }
.frames { display: flex; gap: 2px; height: 12px; }
.frame { flex: 1; border-radius: 1.5px; background: #2a2620; transition: background .25s; }
.frame.on { background: var(--accent); box-shadow: 0 0 6px -1px var(--accent); }

.posters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; padding: 14px 14px 6px; }
.poster { position: relative; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.poster .art { all: unset; cursor: pointer; position: relative; display: block; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.poster .art:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.poster .art:hover { transform: translateY(-2px); }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) brightness(.55); transition: filter .3s; }
.poster.watched img { filter: none; }
.poster.watched .art { box-shadow: 0 0 0 2px var(--accent); }
.poster.removed { opacity: .45; }
.poster.removed img { filter: grayscale(1); }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; font-family: var(--marquee); font-weight: 800; text-transform: uppercase; line-height: .95; font-size: .95rem; color: var(--fg); overflow: hidden; overflow-wrap: anywhere; }
.ph small { font-family: var(--mono); font-weight: 400; font-size: .62rem; color: var(--muted); }
.poster:not(.watched) .ph { opacity: .55; }
.tick { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(243,237,228,.7); background: rgba(14,13,12,.55); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: transparent; z-index: 1; }
.tick:hover { border-color: var(--accent); }
.poster.watched .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.flag { position: absolute; left: 5px; bottom: 5px; font-size: .6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(14,13,12,.75); color: var(--fg); padding: 1px 6px; border-radius: 99px; }
.hover-title { position: absolute; inset: auto 0 0 0; z-index: 2; padding: 22px 7px 7px; font-size: .72rem; font-weight: 600; line-height: 1.2; color: var(--fg); background: linear-gradient(to top, rgba(14,13,12,.95) 40%, transparent); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none; }
.poster .art:hover .hover-title, .poster .art:focus-visible .hover-title { opacity: 1; transform: none; }
.card-foot { display: flex; justify-content: space-between; gap: 12px; padding: 6px 16px 14px; }
.linkbtn { border: none; background: none; color: var(--muted); font-size: .8rem; padding: 4px 0; }
.linkbtn:hover, .linkbtn.armed { color: var(--danger); }
.linkbtn.armed { font-weight: 600; }
.linkbtn[data-showremoved]:hover { color: var(--fg); }
.sheet-remove { align-self: flex-start; }
.skeleton { padding: 30px 16px; color: var(--muted); text-align: center; font-size: .9rem; }

.empty { flex: 0 0 min(100%, 520px); padding: 40px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 20px; text-align: center; }
.empty strong { display: block; font-family: var(--marquee); font-weight: 800; font-size: 1.8rem; text-transform: uppercase; color: var(--fg); margin-bottom: 6px; }

/* Film sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
/* Fixed size, so the arrows stay put while stepping between films; the plot scrolls instead. */
.sheet { position: relative; width: min(100%, 880px); height: min(620px, calc(100vh - 32px)); overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px 28px; padding: 22px 26px 26px; }
.sheet-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.sheet-nav { display: flex; gap: 8px; }
.nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); font-size: 1.3rem; line-height: 1; display: grid; place-items: center; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.sheet .big { all: unset; cursor: pointer; position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--raise); align-self: start; box-shadow: 0 20px 40px -20px rgba(0,0,0,.9); }
.sheet .big:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.big-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(14,13,12,.8); opacity: 0; transition: opacity .15s; }
.sheet .big:hover .big-hint, .sheet .big:focus-visible .big-hint { opacity: 1; }
@media (hover: none) { .big-hint { opacity: .85; } }
.film-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .82rem; color: var(--muted); min-height: 28px; }
.score b { font-family: var(--marquee); font-weight: 800; font-size: 1.25rem; color: var(--fg); }
.score small { font-family: var(--mono); font-size: .68rem; margin-left: 2px; }
.runtime { font-family: var(--mono); font-size: .74rem; margin-right: 4px; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); text-decoration: none; font-size: .76rem; font-weight: 600; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.picker { position: absolute; inset: 0; z-index: 3; background: var(--surface); display: flex; flex-direction: column; gap: 14px; padding: 22px 26px; }
.picker-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.picker-top strong { font-family: var(--marquee); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; }
.picker-top span { display: flex; gap: 8px; }
.picker-top .btn { padding: 8px 12px; }
.picker-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; grid-auto-rows: max-content; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.pick { all: unset; cursor: pointer; display: block; position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--line); }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick:hover, .pick:focus-visible { box-shadow: 0 0 0 2px var(--fg); }
.pick.on { box-shadow: 0 0 0 3px var(--accent); }
.pick span { position: absolute; left: 4px; top: 4px; font-family: var(--mono); font-size: .6rem; text-transform: uppercase; padding: 1px 5px; border-radius: 99px; background: rgba(14,13,12,.8); }
.sheet .big img { width: 100%; height: 100%; object-fit: cover; }
.sheet .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.sheet .body > * { flex: none; }
.sheet .eyebrow { font-family: var(--mono); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet h3 { margin: 0; font-family: var(--marquee); font-weight: 800; font-size: 3rem; line-height: .92; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.sheet h3 .year { font-family: var(--mono); font-weight: 400; font-size: .95rem; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.sheet .body > .overview { flex: 0 1 auto; min-height: 3em; overflow-y: auto; font-size: .92rem; line-height: 1.5; color: var(--muted); margin: 0; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.sheet .body > .spacer { flex: 1 1 0; }
.sheet textarea { font: inherit; font-size: .92rem; width: 100%; min-height: 100px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
.sheet textarea:focus { border-color: var(--accent); outline: none; }
.sheet label.small { font-size: .8rem; color: var(--muted); margin-bottom: -8px; }
.sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
@media (max-width: 640px) {
  .sheet-back { align-items: flex-end; padding: 0; }
  .sheet { grid-template-columns: 120px 1fr; gap: 12px 16px; padding: 16px 18px max(20px, env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; height: min(86vh, 700px); }
  .sheet h3 { font-size: 1.9rem; }
}
footer { padding-block: 8px 28px; color: var(--muted); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
footer img { height: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="gutter">
  <div class="brand">
    <h1>Director <span>Runs</span></h1>
    <p>Work through a filmography, one frame at a time.</p>
  </div>
  <button class="trophy-btn" type="button" id="trophyBtn" hidden></button>
</header>

<main id="screen"></main>

<section class="addbar gutter" id="addPanel" hidden>
  <div class="add-row">
    <input class="field" id="search" type="search" placeholder="Add any director, e.g. Agnès Varda" autocomplete="off" aria-label="Search directors">
    <button class="btn" id="randomBtn" type="button">Pick one at random</button>
  </div>
  <div id="suggest"></div>
  <div class="results" id="results"></div>
</section>

<div class="rowwrap" id="rowwrap" hidden>
  <button class="nav prev" type="button" id="prevBtn" hidden aria-label="Scroll left">‹</button>
  <div class="row" id="cards"></div>
  <button class="nav next" type="button" id="nextBtn" hidden aria-label="Scroll right">›</button>
</div>

<section class="gutter trophy-view" id="trophyView" hidden></section>

<footer class="gutter" id="footer" hidden>
  <span>Film data and images from <a href="https://www.themoviedb.org" style="color:inherit">TMDB</a>. This site uses the TMDB API but is not endorsed or certified by TMDB.</span>
  <button class="linkbtn" type="button" id="signOutBtn">Sign out</button>
</footer>

<div class="sheet-back" id="sheetBack" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script>
<script src="app.js?v=12"></script>
</body>
</html>
